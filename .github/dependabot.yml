version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      npm-version-updates:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/aws-runner"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      python-version-updates:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      action-version-updates:
        patterns:
          - "*"
